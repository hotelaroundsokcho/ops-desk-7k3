<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="origin">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>어라운드 예약 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#17212B; --ink2:#566370; --line:#D9DFE4;
  --sea:#2D5F78; --sea-t:#E3EDF2; --amber:#E8981C; --amber-t:#FFF1D6;
  --glass:#3F7F6B; --glass-t:#E1F0EA; --rust:#B3443B; --rust-t:#F8E4E1;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 6px 20px rgba(23,33,43,.05); --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E151B; --surface:#16202A; --ink:#E7EDF1; --ink2:#9AA8B3; --line:#263340;
  --sea:#7FB5CE; --sea-t:#1B2E3A; --amber:#F2AE3D; --amber-t:#3A2D14;
  --glass:#6FC3A8; --glass-t:#173128; --rust:#E7857B; --rust-t:#3A1E1B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:8px}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 바 + 등대 스윕(시그니처) */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-weight:700;font-size:15px;letter-spacing:.22em}
.brand span{color:var(--ink2);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.chip svg{width:16px;height:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--glass)}
.chip.bad{border-color:var(--rust);color:var(--rust);background:var(--rust-t)} .chip.bad .dot{background:var(--rust)}
.chip.warn{border-color:var(--amber);background:var(--amber-t)} .chip.warn .dot{background:var(--amber)}
.sweep{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;pointer-events:none}
.sweep::before{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:0;transform:translateX(-100%)}
.sweep.go::before{animation:sweep 1.9s cubic-bezier(.35,0,.2,1) 1}
@keyframes sweep{0%{opacity:0;transform:translateX(-100%)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(300%)}}
@keyframes beat{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sweep.go::before{animation:none;width:100%;opacity:1;transform:none;background:var(--amber)}
  .row.need::before{animation:none!important}
}

/* 배너 */
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;margin-top:12px;font-size:14px;line-height:1.45}
.banner svg{width:20px;height:20px;flex:none}
.banner .grow{flex:1}
.banner button{min-height:36px;padding:0 14px;border-radius:10px;border:1px solid currentColor;background:transparent;font-weight:600}
.b-bad{background:var(--rust-t);color:var(--rust)} .b-warn{background:var(--amber-t);color:var(--ink)} .b-info{background:var(--sea-t);color:var(--sea)}

/* 히어로 카운터 */
.hero{display:flex;align-items:center;gap:20px;margin:16px 0 8px;padding:20px 22px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);border-left:6px solid var(--glass)}
.hero.need{border-left-color:var(--amber)}
.hero .n{font-size:56px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;min-width:1.2ch}
.hero p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.hero b{font-size:17px}

/* 탭·필터 */
.tabs{display:flex;gap:4px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;min-height:44px;padding:0 16px;border:0;background:transparent;border-radius:999px;color:var(--ink2);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.tabs .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--rust);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--sea);color:#fff}
.field{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.grow{flex:1;min-width:160px}

/* 예약 행 */
.list{display:grid;gap:10px;padding-bottom:80px}
.row{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 14px 24px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;cursor:pointer}
.row::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--line)}
.row.need::before{background:var(--amber);animation:beat 2.4s ease-in-out infinite}
.row.need.cancel::before{background:var(--rust)}
.row.done::before{background:var(--glass);opacity:.5}
.row .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .l2{margin-top:4px;font-size:15px;font-weight:600}
.row .l3{margin-top:2px;color:var(--ink2);font-size:13.5px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700}
.t-new{background:var(--sea);color:#fff} .t-change{border:1.5px solid var(--sea);color:var(--sea)} .t-cancel{background:var(--rust);color:#fff}
.ch{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:7px;background:var(--bg);font-size:12.5px;font-weight:600}
.age{color:var(--ink2);font-size:12.5px;margin-left:auto}
.chk{display:flex;align-items:center;gap:12px;min-width:196px;min-height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink2);display:grid;place-items:center;flex:none}
.chk .box svg{width:16px;height:16px;opacity:0;stroke:#fff}
.chk small{display:block;color:var(--ink2);font-size:12px;line-height:1.3}
.chk b{display:block;font-size:14px}
.chk[aria-checked=true]{border-color:var(--glass);background:var(--glass-t)}
.chk[aria-checked=true] .box{background:var(--glass);border-color:var(--glass)} .chk[aria-checked=true] .box svg{opacity:1}
.chk[aria-disabled=true]{cursor:default}
.chk.busy{opacity:.55;pointer-events:none}
@media (max-width:640px){
  .row{grid-template-columns:1fr}.chk{width:100%}
  .top .wrap{min-height:52px;flex-wrap:nowrap;gap:8px}.brand span{display:none}
  .bar{flex-wrap:nowrap;gap:6px}.chip{padding:0 10px;font-size:12.5px;min-height:40px}.chip .lbl{display:none}
  .hero{padding:16px 18px}.hero .n{font-size:44px}
  .menu{top:52px}
}

/* 상세 */
.detail{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;cursor:default}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 20px;margin:0}
.dgrid dt{font-size:12px;color:var(--ink2);margin:0}
.dgrid dd{margin:2px 0 0;font-weight:600;word-break:break-all}
.dgrid .wide{grid-column:1/-1}
.dgrid .req{font-weight:400;white-space:pre-wrap;color:var(--ink2);font-size:13.5px;max-height:7.5em;overflow:auto}
.diff{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--amber-t);font-size:14px}
.diff ul{margin:6px 0 0;padding-left:18px}
.note{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--rust-t);color:var(--rust);font-size:13.5px}
.hist{margin-top:14px;font-size:13px;color:var(--ink2)}
.hist li{margin:2px 0}
.linkbtn{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}

/* 빈 상태·카드 */
.empty{padding:56px 16px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.kpi small{color:var(--ink2);font-size:12.5px}
.kpi div{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)} th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--ink2);font-weight:600}
.scroll{overflow-x:auto}
.bars rect{fill:var(--sea)} .bars text{fill:var(--ink2);font-size:10px}
.mini{height:8px;border-radius:4px;background:var(--sea);display:inline-block;vertical-align:middle}

/* 로그인·게이트 */
.center{min-height:100dvh;display:grid;place-items:center;padding:24px}
.panel{width:min(420px,100%);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:32px 28px}
.panel h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.panel p{margin:0 0 20px;color:var(--ink2)}
.panel label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px}
.panel .field{width:100%}
.btn{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:12px;background:var(--sea);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.btn[disabled]{opacity:.55}
.err{color:var(--rust);font-size:13.5px;margin-top:12px;min-height:1.4em}
.mark{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 25%,transparent);margin-right:10px;vertical-align:1px}

/* 메뉴·다이얼로그·토스트 */
.menu{position:absolute;right:16px;top:58px;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:30}
.menu button{display:block;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:9px;background:transparent;text-align:left}
.menu button:hover{background:var(--bg)}
dialog{border:0;border-radius:18px;padding:24px;width:min(420px,calc(100% - 32px));background:var(--surface);color:var(--ink);box-shadow:0 24px 64px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,18,26,.45)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
.staffrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.staffrow:last-child{border:0} .staffrow .grow{min-width:0}
.mini-btn{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword, reauthenticateWithCredential, EmailAuthProvider, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, query, where, orderBy, limit, getDocs, writeBatch, setDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

/* ───────── 설정 (README 3번에서 Firebase 값으로 교체) ───────── */
const FIREBASE_CONFIG = { apiKey: 'AIzaSyBq8Bl5dxD2P_0PJhRfJ7w4mPLpJI8Wo8Q', authDomain: 'hotel-around-rsv.firebaseapp.com', projectId: 'hotel-around-rsv', appId: '1:937935595319:web:6f48d003c308b98f521cb2' };
const LOGIN_DOMAIN = 'staff.hotelaround.app';   // 직원 로그인ID → ID@도메인 (실제 메일 아님)
const REPEAT_AFTER_MIN = 5;                     // 미반영이 이 시간을 넘으면 반복음 + 상단 경고
const STALE_MIN = 5;                            // 메일 수집기가 이 시간 이상 멈추면 경고
const PRICE_IS_TOTAL = true;                    // 객실입금가가 투숙 전체 합계인지(true) / 1박·1실 단가인지(false) — 실제 건으로 확인 필요

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const won = n => Math.round(n || 0).toLocaleString('ko-KR') + '원';
const ms = v => v?.toDate ? v.toDate().getTime() : (v instanceof Date ? v.getTime() : 0);
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const fmtD = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${m}.${d} ${DOW[new Date(y, m - 1, d).getDay()]}`; };
const fmtT = t => { if (!t) return ''; const d = new Date(t), n = new Date(); const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`; return d.toDateString() === n.toDateString() ? hm : `${d.getMonth() + 1}.${d.getDate()} ${hm}`; };
const ago = t => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? '방금' : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m / 60)}시간 전` : `${Math.floor(m / 1440)}일 전`; };
const toast = (m, t = 3200) => { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), t); };

const I = {
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  bellOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 6.3A6 6 0 0 0 6 9c0 6-2.5 7.5-2.5 7.5H17M18 13.5V9a6 6 0 0 0-9.7-4.7"/><path d="M10 20a2 2 0 0 0 4 0M3 3l18 18"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.8-3.6 3.9-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>'
};

/* ───────── 상태 ───────── */
const now = new Date();
const state = {
  user: null, staff: null, started: false, tab: 'rsv', blocked: '',
  pending: [], list: [], unparsed: [], staffList: [], heartbeat: null, hbLoaded: false,
  filter: { scope: 'pending', channel: '', q: '' }, open: null, history: {}, busy: new Set(),
  stat: { month: `${now.getFullYear()}-${pad(now.getMonth() + 1)}`, basis: 'receipt', channel: '', rows: null, loading: false, trend: null, pii: false },
  soundOn: true, audioBlocked: false, menu: false
};
const alerts = { primed: false, seen: new Map(), ctx: null, lastUrgent: 0, wake: null };
let app, auth, db, unsubs = [];

if (FIREBASE_CONFIG.apiKey === 'REPLACE') {
  $('#app').innerHTML = `<div class="center"><div class="panel"><h1>설정이 필요합니다</h1><p>index.html 상단의 FIREBASE_CONFIG 를 Firebase 프로젝트 값으로 바꿔 주세요. (README 3번)</p></div></div>`;
} else {
  app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app); db = getFirestore(app);
  onAuthStateChanged(auth, u => { state.user = u; u ? watchStaff(u) : (stopData(), state.staff = null, state.started = false, state.open = null, mountLogin()); });
}

/* ───────── 로그인 / 게이트 ───────── */
function mountLogin(msg = '') {
  $('#app').innerHTML = `<div class="center"><form class="panel" id="lf" autocomplete="on">
    <h1><span class="mark"></span>AROUND</h1><p>예약 인입 콘솔 · 직원 전용</p>
    <label for="lid">아이디</label><input class="field" id="lid" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="lpw">비밀번호</label><input class="field" id="lpw" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert">${esc(msg)}</div>
    <button class="btn" type="submit">로그인</button></form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const b = $('.btn'); b.disabled = true; $('#lerr').textContent = '';
    const id = $('#lid').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
    try { await signInWithEmailAndPassword(auth, `${id}@${LOGIN_DOMAIN}`, $('#lpw').value); }
    catch (er) { $('#lerr').textContent = er.code === 'auth/too-many-requests' ? '시도가 너무 많습니다. 잠시 후 다시 해 주세요.' : '아이디 또는 비밀번호를 확인해 주세요.'; b.disabled = false; }
  };
}
function mountGate() {

  b.set(doc(collection(ref, 'checks')), { uid: u.uid, name: u.name, action: want ? 'check' : 'uncheck', at: serverTimestamp(), eventTs: r.lastEventAt || null });
  try { await b.commit(); toast(want ? 'PMS 반영 확인을 기록했습니다.' : '확인을 해제했습니다.'); delete state.history[no]; if (state.open === no) loadHistory(no); }
  catch (e) { toast(e.code === 'permission-denied' ? '이미 다른 담당자가 처리했거나 권한이 없습니다. 목록을 새로 확인하세요.' : '저장하지 못했습니다. 네트워크를 확인하고 다시 눌러 주세요.'); }
  finally { state.busy.delete(no); renderList(); }
}

/* ───────── 통계 ───────── */
function monthOpts() { const o = [], d = new Date(); for (let i = 0; i < 18; i++) { o.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); d.setMonth(d.getMonth() - 1); } return o; }
const nextMonth = m => { const [y, mo] = m.split('-').map(Number); return mo === 12 ? `${y + 1}-01-01` : `${y}-${pad(mo + 1)}-01`; };
async function loadStat() {
  const s = state.stat; s.loading = true; renderStat();
  const field = s.basis === 'receipt' ? 'receiptDate' : 'checkIn';
  try {
    const snap = await getDocs(query(collection(db, 'reservations'), where(field, '>=', `${s.month}-01`), where(field, '<', nextMonth(s.month))));
    s.rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch { s.rows = null; toast('통계를 불러오지 못했습니다.'); }
  s.loading = false; renderStat();
}
const total = r => PRICE_IS_TOTAL ? (r.roomCost || 0) : (r.roomCost || 0) * (r.nights || 0) * (r.rooms || 1);
function agg(rows) {
  const valid = rows.filter(r => r.status !== 'CANCELLED'), canc = rows.length - valid.length;
  const rn = valid.reduce((a, r) => a + (r.nights || 0) * (r.rooms || 1), 0), amt = valid.reduce((a, r) => a + total(r), 0);
  return { n: valid.length, canc, rate: rows.length ? canc / rows.length : 0, rn, amt, adr: rn ? amt / rn : 0, valid };
}
function renderStat() {
  const p = $('#pane'), s = state.stat;
  const ctl = `<div class="tools"><select class="field" id="smo" aria-label="월">${monthOpts().map(m => `<option ${m === s.month ? 'selected' : ''} value="${m}">${m.replace('-', '년 ')}월</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="기준"><button data-act="basis" data-v="receipt" aria-pressed="${s.basis === 'receipt'}">접수일 기준</button><button data-act="basis" data-v="checkin" aria-pressed="${s.basis === 'checkin'}">체크인 기준</button></div>
    <select class="field" id="sch" aria-label="채널"><option value="">전체 채널</option>${[...new Set((s.rows || []).map(r => r.channel))].sort().map(c => `<option ${s.channel === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <button class="mini-btn" data-act="statload">${s.rows ? '새로고침' : '불러오기'}</button></div>`;
  let body = '';
  if (s.loading) body = '<div class="empty"><b>불러오는 중…</b></div>';
  else if (!s.rows) body = '<div class="empty"><b>월과 기준을 고른 뒤 불러오기를 누르세요</b>조회한 만큼 읽기 횟수가 사용됩니다.</div>';
  else {
    const rows = s.channel ? s.rows.filter(r => r.channel === s.channel) : s.rows, A = agg(rows);
    const chans = [...new Set(s.rows.map(r => r.channel))].map(c => ({ c, ...agg(s.rows.filter(r => r.channel === c)) })).sort((a, b) => b.n - a.n);
    const key = s.basis === 'receipt' ? 'receiptDate' : 'checkIn', days = new Date(+s.month.slice(0, 4), +s.month.slice(5), 0).getDate(), cnt = Array(days).fill(0);
    A.valid.forEach(r => { const d = +String(r[key]).slice(8, 10); if (d >= 1 && d <= days) cnt[d - 1]++; });
    const mx = Math.max(1, ...cnt), W = 640, H = 130, bw = W / days;
    const svg = `<svg class="bars" viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="일별 유효 예약 건수">${cnt.map((v, i) => `<g><title>${i + 1}일 ${v}건</title><rect x="${i * bw + 2}" y="${H - (v / mx) * (H - 10)}" width="${bw - 4}" height="${(v / mx) * (H - 10)}" rx="3"/></g>${(i + 1) % 5 === 0 || i === 0 ? `<text x="${i * bw + bw / 2}" y="${H + 14}" text-anchor="middle">${i + 1}</text>` : ''}`).join('')}</svg>`;
    body = `<div class="kpis"><div class="kpi"><small>유효 예약</small><div>${A.n}건</div></div><div class="kpi"><small>취소</small><div>${A.canc}건 <span style="font-size:14px;color:var(--ink2)">${(A.rate * 100).toFixed(1)}%</span></div></div>
      <div class="kpi"><small>객실박수</small><div>${A.rn}</div></div><div class="kpi"><small>입금가 합계</small><div>${won(A.amt)}</div></div><div class="kpi"><small>객실박당 평균</small><div>${won(A.adr)}</div></div></div>
      <div class="card"><b>${s.basis === 'receipt' ? '접수일' : '체크인'}별 유효 예약</b>${svg}</div>
      <div class="card scroll"><table><thead><tr><th>채널</th><th>유효</th><th>취소</th><th>취소율</th><th>객실박</th><th>입금가</th><th>비중</th></tr></thead><tbody>
      ${chans.map(x => `<tr><td>${esc(x.c)}</td><td>${x.n}</td><td>${x.canc}</td><td>${(x.rate * 100).toFixed(1)}%</td><td>${x.rn}</td><td>${won(x.amt)}</td><td>${total0(chans) ? ((x.amt / total0(chans)) * 100).toFixed(0) : 0}%</td></tr>`).join('')}</tbody></table></div>
      <div class="card scroll"><b>객실종류별${s.channel ? ' (' + esc(s.channel) + ')' : ''}</b><table><thead><tr><th>객실종류</th><th>유효</th><th>취소</th><th>객실박</th><th>입금가</th><th>객실박당</th></tr></thead><tbody>
      ${[...new Set(rows.map(r => r.roomType || '(미표기)'))].map(t => ({ t, ...agg(rows.filter(r => (r.roomType || '(미표기)') === t)) })).sort((a, b) => b.n - a.n).map(x => `<tr><td>${esc(x.t)}</td><td>${x.n}</td><td>${x.canc}</td><td>${x.rn}</td><td>${won(x.amt)}</td><td>${won(x.adr)}</td></tr>`).join('')}</tbody></table></div>
      <div class="tools"><button class="mini-btn" data-act="csv">CSV 내려받기</button>${state.staff.role === 'admin' ? `<label style="display:flex;align-items:center;gap:8px;font-size:13.5px"><input type="checkbox" id="spii" ${s.pii ? 'checked' : ''}> 개인정보(고객명·연락처·이메일) 포함</label>` : ''}
      <button class="mini-btn" data-act="trend">최근 12개월 추이 ${s.trend ? '새로고침' : '불러오기'}</button></div>
      ${s.trend ? trendHtml(s.trend) : ''}
      <p style="color:var(--ink2);font-size:12.5px">유효 예약 = 취소 제외. 입금가는 ${PRICE_IS_TOTAL ? '투숙 전체 합계' : '1박·1실 단가 × 박수 × 객실수'}로 계산합니다.</p>`;
  }
  p.innerHTML = ctl + body;
  $('#smo').onchange = e => { s.month = e.target.value; s.rows = null; renderStat(); };
  $('#sch').onchange = e => { s.channel = e.target.value; renderStat(); };
  const sp = $('#spii'); if (sp) sp.onchange = e => { s.pii = e.target.checked; };
}
const total0 = ch => ch.reduce((a, x) => a + x.amt, 0);
function trendHtml(t) {
  const mx = Math.max(1, ...t.map(x => x.n));
  return `<div class="card scroll"><b>월별 추이 (접수일 기준)</b><table><thead><tr><th>월</th><th>유효</th><th></th><th>취소</th><th>입금가</th></tr></thead><tbody>${t.map(x => `<tr><td>${x.m}</td><td>${x.n}</td><td style="text-align:left"><span class="mini" style="width:${(x.n / mx) * 120}px"></span></td><td>${x.canc}</td><td>${won(x.amt)}</td></tr>`).join('')}</tbody></table></div>`;
}
async function loadTrend() {
  const ms12 = monthOpts().slice(0, 12).reverse();
  toast('12개월 데이터를 조회합니다…');
  try {
    const snap = await getDocs(query(collection(db, 'reservations'), where('receiptDate', '>=', `${ms12[0]}-01`), where('receiptDate', '<', nextMonth(ms12[11]))));
    const by = {}; snap.docs.forEach(d => { const r = d.data(), m = String(r.receiptDate).slice(0, 7); (by[m] ||= []).push(r); });
    state.stat.trend = ms12.map(m => { const a = agg(by[m] || []); return { m, n: a.n, canc: a.canc, amt: a.amt }; });
    toast(`${snap.size}건 조회 완료`); renderStat();
  } catch { toast('추이를 불러오지 못했습니다.'); }
}
const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };   // 엑셀 수식 주입 방지
function downloadCsv() {
  const s = state.stat; if (!s.rows) return;
  const rows = s.channel ? s.rows.filter(r => r.channel === s.channel) : s.rows, pii = state.staff.role === 'admin' && s.pii;
  const head = ['호텔명', '접수번호', '접수일', '상태', '채널명', '투숙기간(박)', '체크인', '체크아웃', '객실종류', '채널예약번호', '투숙인원', '객실수', '객실입금가', ...(pii ? ['고객명', '연락처', '이메일'] : [])];
  const T = { NEW: '신규', CHANGED: '변경', CANCELLED: '취소' };
  const lines = [head, ...rows.map(r => [r.hotelName, r.id, r.receiptDate, T[r.status] || r.status, r.channel, r.nights, r.checkIn, r.checkOut, r.roomType, r.channelResNo, r.guestsText, r.rooms, r.roomCost, ...(pii ? [r.guestName, r.phone, r.email] : [])])].map(l => l.map(csvCell).join(','));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = `예약_${s.month}_${s.basis === 'receipt' ? '접수일' : '체크인'}${s.channel ? '_' + s.channel : ''}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ───────── 미파싱 / 계정 ───────── */
function renderUnparsed() {
  const u = [...state.unparsed].sort((a, b) => ms(b.receivedAt) - ms(a.receivedAt));
  $('#pane').innerHTML = u.length ? `<div class="list">${u.map(x => `<article class="card" style="margin:0"><div class="l1"><span class="tag t-cancel">읽지 못함</span><span class="age">${fmtT(ms(x.receivedAt))}</span></div>
    <p style="margin:8px 0 4px;font-weight:600;word-break:break-all">${esc(x.subject)}</p><p style="margin:0;color:var(--ink2);font-size:13.5px">${esc(x.reason)}</p>
    <div class="tools" style="margin:12px 0 0"><a class="linkbtn" style="margin:0" href="${esc(x.gmailUrl)}" target="_blank" rel="noopener noreferrer">원문 메일 열기</a><button class="mini-btn" data-act="resolve" data-id="${esc(x.id)}">직접 처리했음</button></div></article>`).join('')}</div>`
    : `<div class="empty"><b>읽지 못한 메일이 없습니다</b>호텔스토리 메일 서식이 바뀌면 여기에 쌓입니다.</div>`;
}
function renderAccounts() {
  const me = state.staff.uid, L = [...state.staffList].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
  $('#pane').innerHTML = `<div class="card"><b>직원 계정</b>${L.map(s => `<div class="staffrow"><div class="grow"><b>${esc(s.name)}</b> <span style="color:var(--ink2)">${esc(s.title || '')} · ${esc(s.loginId || '')}</span></div>
    <span class="chip ${s.active ? '' : 'bad'}"><i class="dot"></i>${s.active ? '사용 중' : '중지'}</span>${s.id === me ? '' : `<button class="mini-btn" data-act="active" data-id="${esc(s.id)}" data-v="${s.active ? 0 : 1}">${s.active ? '사용 중지' : '다시 사용'}</button>`}</div>`).join('') || '<p>등록된 직원이 없습니다.</p>'}</div>
    <form class="card" id="nf"><b>직원 추가</b>
    <div class="tools" style="margin-top:12px"><input class="field grow" id="nn" placeholder="이름" required maxlength="20"><input class="field grow" id="ni" placeholder="로그인 아이디 (영문·숫자)" required autocapitalize="none" pattern="[A-Za-z0-9._-]{3,20}">
    <select class="field" id="nt"><option>매니저</option><option>부점장</option><option>점장</option></select></div>
    <div class="tools"><input class="field grow" id="np" type="password" placeholder="임시 비밀번호 (8자 이상)" minlength="8" required autocomplete="new-password"><button class="mini-btn" style="min-height:44px">계정 만들기</button></div>
    <p style="color:var(--ink2);font-size:12.5px;margin:0">비밀번호를 잊은 직원은 계정을 중지한 뒤 새 아이디로 다시 등록하거나, Firebase 콘솔에서 재설정합니다. 중지 즉시 모든 데이터 접근이 막힙니다.</p></form>`;
  $('#nf').onsubmit = async e => {

    const sec = initializeApp(FIREBASE_CONFIG, 'sec' + Date.now());

      const cred = await createUserWithEmailAndPassword(getAuth(sec), `${id}@${LOGIN_DOMAIN}`, pw);

      toast(`${name} 계정을 만들었습니다.`); $('#nf').reset();
    } catch (er) { toast(er.code === 'auth/email-already-in-use' ? '이미 쓰는 아이디입니다.' : er.code === 'auth/weak-password' ? '비밀번호가 너무 약합니다.' : '계정을 만들지 못했습니다. 이미 만들어졌는지 목록을 확인하세요.'); }
    finally { try { await signOut(getAuth(sec)); await deleteApp(sec); } catch { } btn.disabled = false; }
  };
}

/* ───────── 이벤트 위임 ───────── */
document.addEventListener('click', async e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); const menu = e.target.closest('.menu');
  if (state.menu && !menu && el?.dataset.act !== 'menu') { state.menu = false; renderChrome(); }
  if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'check') { e.stopPropagation(); return toggleCheck(d.no); }
  if (a === 'open') { if (e.target.closest('a,button.chk,.detail')) return; state.open = state.open === d.no ? null : d.no; renderList(); if (state.open) loadHistory(state.open); return; }
  if (a === 'tab') { state.tab = d.tab; renderChrome(); renderPane(); }
  else if (a === 'scope') { state.filter.scope = d.v; renderPane(); }
  else if (a === 'sound') { state.soundOn = !state.soundOn; if (state.soundOn) { ensureAudio(); chime('new'); } renderChrome(); }
  else if (a === 'menu') { state.menu = !state.menu; renderChrome(); }
  else if (a === 'test') { state.menu = false; renderChrome(); ensureAudio(); chime('new'); setTimeout(() => chime('urgent'), 1200); sweep(); }
  else if (a === 'logout') { state.started = false; signOut(auth); }
  else if (a === 'pw') { state.menu = false; renderChrome(); pwDialog(); }
  else if (a === 'basis') { state.stat.basis = d.v; state.stat.rows = null; renderStat(); }
  else if (a === 'statload') loadStat();
  else if (a === 'trend') loadTrend();
  else if (a === 'csv') downloadCsv();
  else if (a === 'resolve') { try { await updateDoc(doc(db, 'unparsed', d.id), { resolved: true, resolvedByName: state.staff.name, resolvedAt: serverTimestamp() }); toast('처리 완료로 표시했습니다.'); } catch { toast('저장하지 못했습니다.'); } }
  else if (a === 'active') { try { await updateDoc(doc(db, 'staff', d.id), { active: d.v === '1' }); toast(d.v === '1' ? '계정을 다시 사용합니다.' : '계정을 중지했습니다.'); } catch { toast('저장하지 못했습니다.'); } }
});
document.addEventListener('keydown', e => { const r = e.target.closest?.('article.row'); if (r && e.target === r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); } });
function pwDialog() {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog" id="pf"><h2 style="margin:0 0 12px;font-size:19px">비밀번호 변경</h2>

    <div class="err" id="pe" role="alert"></div><button class="btn" id="pok" type="submit" value="ok">변경</button><button class="btn ghost" type="button" id="pcx">취소</button></form>`;

}
